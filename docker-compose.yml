services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmk}
      POSTGRES_USER: ${POSTGRES_USER:-bmk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmkchangeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bmk} -d ${POSTGRES_DB:-bmk}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./bmk-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.localhost,api,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:8080,http://127.0.0.1:8080,http://balamukundam.localhost:8080,http://balavikas.localhost:8080}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}
      CORS_ALLOWED_ORIGIN_REGEXES: ${CORS_ALLOWED_ORIGIN_REGEXES:-^http://([a-z0-9-]+\.)?localhost(:\d+)?$}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bmk}
      POSTGRES_USER: ${POSTGRES_USER:-bmk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmkchangeme}
      SEED_ON_START: ${SEED_ON_START:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      APP_DOMAIN: ${VITE_APP_DOMAIN:-localhost}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    # Optional direct API access for debugging
    ports:
      - '8000:8000'

  web:
    build:
      context: ./bmk-ui
      args:
        VITE_APP_DOMAIN: ${VITE_APP_DOMAIN:-localhost}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  postgres_data:
