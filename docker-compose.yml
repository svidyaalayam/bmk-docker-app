services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmk}
      POSTGRES_USER: ${POSTGRES_USER:-bmk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmkchangeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bmk} -d ${POSTGRES_DB:-bmk}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./bmk-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.localhost,api,web,host.docker.internal}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_REGEXES: ${CORS_ALLOWED_ORIGIN_REGEXES:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bmk}
      POSTGRES_USER: ${POSTGRES_USER:-bmk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmkchangeme}
      SEED_ON_START: ${SEED_ON_START:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PORT: 8000
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Balamukundam Vidyalayam <noreply@balamukundam.com>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      FRONTEND_PORT: ${FRONTEND_PORT:-}
      HOMEWORK_STORAGE_BACKEND: ${HOMEWORK_STORAGE_BACKEND:-local}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-bmk-homework}
      AZURE_BLOB_SAS_EXPIRY_HOURS: ${AZURE_BLOB_SAS_EXPIRY_HOURS:-24}
      SIKSHAVAHINI_SHARED_SECRET: ${SIKSHAVAHINI_SHARED_SECRET:-siksha-dev-shared-secret}
      SUNAADAM_SHARED_SECRET: ${SUNAADAM_SHARED_SECRET:-sunaadam-dev-shared-secret}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    # Optional direct API access for debugging (change API_PORT per env on same VM)
    ports:
      - '${API_PORT:-8000}:8000'

  web:
    build:
      context: ./bmk-ui
      args:
        VITE_APP_DOMAIN: ${VITE_APP_DOMAIN:-localhost}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-local}
        VITE_SIKSHAVAHINI_URL: ${VITE_SIKSHAVAHINI_URL:-http://localhost:8180}
        VITE_SUNAADAM_URL: ${VITE_SUNAADAM_URL:-http://localhost:8280}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
